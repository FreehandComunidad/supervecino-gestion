name: Database CI (isolated cloud)

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/database-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-database:
    name: Supabase local stack on GitHub runner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Deno for Supabase Edge Function checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check cryptic Edge Function
        run: deno check supabase/functions/cryptic-score/index.ts

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Assert this job has no remote Supabase credentials
        shell: bash
        run: |
          if [[ -f supabase/.temp/project-ref ]]; then
            echo "Unexpected linked Supabase project metadata found; refusing to continue."
            exit 1
          fi
          if env | grep -Eq '^SUPABASE_(ACCESS_TOKEN|DB_PASSWORD|PROJECT_ID)='; then
            echo "Remote Supabase credentials are not allowed in this isolated test job."
            exit 1
          fi

      - name: Create ephemeral local Supabase configuration
        shell: bash
        run: |
          if [[ ! -f supabase/config.toml ]]; then
            supabase init
          fi
          test -f supabase/config.toml

      - name: Start isolated Supabase stack
        run: supabase start

      - name: Rebuild local database from tracked migrations
        run: supabase db reset --local

      - name: Run database policy and function tests when present
        shell: bash
        run: |
          if compgen -G "supabase/tests/**/*.sql" > /dev/null || find supabase/tests -type f \( -name '*.sql' -o -name '*.pg' \) -print -quit 2>/dev/null | grep -q .; then
            supabase test db --local
          else
            echo "No pgTAP database tests are committed yet; migration replay was still executed."
          fi

      - name: Test cryptic Edge Function against synthetic local data
        shell: bash
        run: |
          printf 'CRYPTIC_ANSWERS_JSON={"1":"TEST"}\n' > supabase/functions/.env
          supabase functions serve cryptic-score --env-file supabase/functions/.env > /tmp/cryptic-edge.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS -X OPTIONS http://127.0.0.1:54321/functions/v1/cryptic-score >/dev/null; then
              break
            fi
            sleep 1
          done
          first=$(curl -fsS -X POST http://127.0.0.1:54321/functions/v1/cryptic-score \
            -H "Content-Type: application/json" \
            -d '{"guest_id":"00000000-0000-4000-8000-000000000001","stage_number":1,"answer":"TEST","hints_used":0}')
          echo "$first"
          echo "$first" | grep -q '"correct":true'
          echo "$first" | grep -q '"points_awarded":100'
          second=$(curl -fsS -X POST http://127.0.0.1:54321/functions/v1/cryptic-score \
            -H "Content-Type: application/json" \
            -d '{"guest_id":"00000000-0000-4000-8000-000000000001","stage_number":1,"answer":"TEST","hints_used":0}')
          echo "$second"
          echo "$second" | grep -q '"already_completed":true'

      - name: Stop isolated stack
        if: always()
        run: supabase stop --no-backup
